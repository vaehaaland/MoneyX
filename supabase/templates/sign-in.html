<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 440px; margin: 0 auto; padding: 24px; color: #161d1b;">
  <h2 style="font-weight: 500; margin: 0 0 8px;">Logg inn i MoneyX</h2>
  <p style="color: #3f4946; margin: 0 0 24px;">Trykk på knappen, eller skriv inn koden i appen.</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; background: #006a60; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 999px; font-weight: 500;">Logg inn</a>
  </p>
  <p style="font-size: 30px; letter-spacing: 6px; font-weight: 500; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="color: #6f7976; font-size: 13px; margin: 0;">Koden og lenka gjeld i éin time. Om du ikkje bad om dette, kan du sjå bort frå e-posten.</p>
</div>
